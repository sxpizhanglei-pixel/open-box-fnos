name: Build Open-Box FPK for fnOS
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/open-box-fnos:latest
            ghcr.io/${{ github.repository_owner }}/open-box-fnos:${{ github.run_number }}

      - name: Lowercase Owner
        id: owner
        run: echo "OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download official fnpack
        run: |
          set -e
          FNPACK_VER="1.2.3"
          FNPACK_URL="https://github.com/fnnas-apps/fnpack/raw/main/archives/fnpack-${FNPACK_VER}-linux-amd64"
          curl -fsSL -o /usr/local/bin/fnpack "${FNPACK_URL}"
          chmod +x /usr/local/bin/fnpack
          fnpack 2>&1 | head -5 || true
          echo "fnpack ready: $(fnpack 2>&1 | grep -i version || echo 'installed')"

      - name: Patch compose image to real owner
        run: |
          OWNER="${{ env.OWNER }}"
          SRC="fnpack-src/open-box/app/docker/docker-compose.yaml"
          # 仓库里 compose 写死占位 owner,CI 时替换为真实账号,保持与已推送的 ghcr 镜像一致
          sed -i "s|ghcr.io/sxpizhanglei-pixel/|ghcr.io/${OWNER}/|" "${SRC}"
          echo "=== compose after patch ==="
          cat "${SRC}"

      - name: Build .fpk with official fnpack
        run: |
          set -e
          cd fnpack-src/open-box
          # 清除可能残留的本地 .fpk 与脚手架污染
          rm -f open-box.fpk
          find . -name '.DS_Store' -delete || true
          fnpack build -d .
          echo "=== 产物自检 ==="
          ls -la open-box.fpk
          echo "=== 解包核对结构 ==="
          mkdir -p /tmp/fpkcheck && tar -xzf open-box.fpk -C /tmp/fpkcheck
          find /tmp/fpkcheck -type f | sort
          echo "=== manifest(应含 fnpack 自动写入的 checksum) ==="
          cat /tmp/fpkcheck/manifest
          echo "=== app.tgz 内 compose ==="
          mkdir -p /tmp/tgzcheck && tar -xzf /tmp/fpkcheck/app.tgz -C /tmp/tgzcheck
          cat /tmp/tgzcheck/docker/docker-compose.yaml
          # 把产物拷到仓库根,供 release step 引用
          cp open-box.fpk ../../open-box.fpk

      - name: Release .fpk Package
        uses: softprops/action-gh-release@v1
        with:
          files: open-box.fpk
          tag_name: v1.0.${{ github.run_number }}
          name: Open-Box fnOS Package v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
