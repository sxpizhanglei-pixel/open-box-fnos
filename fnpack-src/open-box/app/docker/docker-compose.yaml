version: "3.8"
services:
  open-box:
    image: ghcr.io/sxpizhanglei-pixel/open-box-fnos:latest
    container_name: open-box
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Asia/Shanghai
      - SECRET=***
    volumes:
      - /var/apps/open-box/shares/open-box/data:/etc/sing-box
      - /var/apps/open-box/shares/open-box/data/ui:/app/ui
